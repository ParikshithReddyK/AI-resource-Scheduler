spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/scheduler
spring.datasource.username=scheduler
spring.datasource.password=scheduler
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8080

ml.service.base-url=http://localhost:8000
logging.level.org.springframework.web.client.RestClient=DEBUG
logging.level.org.springframework.http.client=DEBUG

app.jwt.secret=change-me-in-production-this-should-be-a-long-random-string
app.jwt.expiration-ms=86400000
